<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>K&M Catalogue Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    header {
      background: #003e2b;
      border-bottom: 5px solid #d4a62a;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      color: #e2b63d;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 13px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .category {
      margin-bottom: 35px;
    }

    .category h2 {
      color: #003e2b;
      border-bottom: 2px solid #d4a62a;
      padding-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    .product img {
      width: 100%;
      height: 210px;
      object-fit: contain;
      display: block;
    }

    .filename {
      margin-top: 10px;
      font-size: 12px;
      word-break: break-word;
      color: #555;
    }

    .count {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }

    .loading {
      padding: 30px;
      text-align: center;
    }

    .error {
      background: #ffe5e5;
      color: #a00000;
      padding: 15px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<header>
  <h1>K&M CATALOGUE ADMIN</h1>
  <p>Product Manager</p>
</header>

<main id="admin">
  <div class="loading">Loading products...</div>
</main>

<script>
const SUPABASE_URL = "https://gynnbpmghwwzimdzhxfw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

const categories = [
  { folder: "rise", title: "RICE" },
  { folder: "drink", title: "DRINKS" },
  { folder: "snacks", title: "SNACKS & SWEETS" },
  { folder: "spices", title: "SPICES" }
];

async function getFolderFiles(folder) {
  const response = await fetch(
    SUPABASE_URL + "/storage/v1/object/list/product%20-image",
    {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        prefix: folder,
        limit: 1000,
        offset: 0,
        sortBy: {
          column: "name",
          order: "asc"
        }
      })
    }
  );

  if (!response.ok) {
    throw new Error("Could not load folder: " + folder);
  }

  return await response.json();
}

function getImageUrl(folder, filename) {
  return (
    SUPABASE_URL +
    "/storage/v1/object/public/product%20-image/" +
    encodeURIComponent(folder) +
    "/" +
    encodeURIComponent(filename)
  );
}

async function loadAdmin() {
  const admin = document.getElementById("admin");
  admin.innerHTML = "";

  try {
    for (const category of categories) {
      const files = await getFolderFiles(category.folder);

      const images = files.filter(file =>
        /\.(png|jpg|jpeg|webp)$/i.test(file.name)
      );

      const section = document.createElement("section");
      section.className = "category";

      const heading = document.createElement("h2");
      heading.textContent = category.title;

      const count = document.createElement("div");
      count.className = "count";
      count.textContent = images.length + " product(s)";

      const grid = document.createElement("div");
      grid.className = "grid";

      images.forEach(file => {
        const card = document.createElement("div");
        card.className = "product";

        const img = document.createElement("img");
        img.src = getImageUrl(category.folder, file.name);
        img.alt = file.name;

        const filename = document.createElement("div");
        filename.className = "filename";
        filename.textContent = file.name;

        card.appendChild(img);
        card.appendChild(filename);
        grid.appendChild(card);
      });

      section.appendChild(heading);
      section.appendChild(count);
      section.appendChild(grid);

      admin.appendChild(section);
    }
  } catch (error) {
    console.error(error);

    admin.innerHTML =
      '<div class="error">Could not load the products.</div>';
  }
}

loadAdmin();
</script>

</body>
</html>
