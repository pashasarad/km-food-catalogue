<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>K&M Catalogue Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  color:#222;
}

header{
  background:#003e2b;
  border-bottom:5px solid #d4a62a;
  color:white;
  padding:20px;
}

header h1{
  margin:0;
  color:#e2b63d;
  font-size:24px;
}

header p{
  margin:6px 0 0;
  font-size:13px;
}

main{
  max-width:1500px;
  margin:auto;
  padding:20px;
}

.login-container{
  max-width:420px;
  margin:70px auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
}

.login-container h2{
  margin-top:0;
  color:#003e2b;
  text-align:center;
}

.login-container input{
  width:100%;
  padding:14px;
  margin-bottom:15px;
  border:1px solid #ccc;
  border-radius:6px;
  font-size:16px;
}

.login-container button{
  width:100%;
  padding:14px;
  background:#003e2b;
  color:white;
  border:none;
  border-radius:6px;
  font-size:16px;
  cursor:pointer;
}

#loginMessage{
  text-align:center;
  color:#b00020;
  margin-top:15px;
  min-height:18px;
}

#adminArea{
  display:none;
}

.admin-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.signed-in{
  font-size:13px;
  color:#555;
}

.logout-btn{
  background:#b00020;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold;
}

.toolbar{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.toolbar input,
.toolbar select,
.add-grid input,
.add-grid select,
.edit-grid input,
.edit-grid select{
  padding:13px 14px;
  font-size:15px;
  border:2px solid #d4a62a;
  border-radius:8px;
  background:white;
  outline:none;
}

.toolbar input{
  flex:1;
  min-width:220px;
}

.toolbar select{
  min-width:260px;
}

button{
  border:none;
  border-radius:7px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:bold;
}

.primary{
  background:#003e2b;
  color:white;
}

.gold{
  background:#d4a62a;
  color:#173a2a;
}

.light{
  background:#e9e9e9;
  color:#222;
}

#loadingStatus{
  display:none;
  background:#fff8dc;
  border:1px solid #d4a62a;
  border-radius:7px;
  padding:10px 14px;
  margin-bottom:20px;
  color:#003e2b;
  font-weight:bold;
}

.add-panel{
  display:none;
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:24px;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.add-panel.open{
  display:block;
}

.add-grid{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:12px;
}

.add-grid .full{
  grid-column:1/-1;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  color:#555;
  margin-bottom:5px;
}

.form-actions,
.order-tools,
.cat-actions{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

.status{
  min-height:20px;
  margin-top:10px;
  font-size:13px;
}

.ok{
  color:#08763c;
}

.error{
  background:#ffe5e5;
  color:#a00000;
  padding:15px;
  border-radius:6px;
}

.category{
  margin-bottom:45px;
}

.category-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:12px;
  border-bottom:2px solid #d4a62a;
  padding-bottom:8px;
  margin-bottom:15px;
}

.category h2{
  color:#003e2b;
  font-size:26px;
  margin:0;
}

.count{
  font-size:14px;
  color:#666;
  margin-top:4px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:22px;
}

.product{
  background:white;
  border-radius:12px;
  padding:12px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
  cursor:grab;
}

.product:active{
  cursor:grabbing;
}

.product.dragging{
  opacity:.4;
  outline:3px dashed #d4a62a;
}

.product img{
  width:100%;
  height:430px;
  object-fit:contain;
  display:block;
  background:#fafafa;
  border-radius:8px;
}

.filename{
  margin-top:10px;
  font-size:13px;
  word-break:break-word;
  color:#666;
}

.toggle-area{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  font-size:16px;
  font-weight:bold;
}

.toggle-area input{
  width:23px;
  height:23px;
  cursor:pointer;
}

.code-badge{
  display:inline-block;
  margin-top:10px;
  padding:5px 8px;
  border-radius:5px;
  background:#eef4f0;
  color:#003e2b;
  font-weight:bold;
}

.edit-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.edit-grid .full{
  grid-column:1/-1;
}

.order-tools{
  margin-top:10px;
}

.drag-handle{
  cursor:grab;
  user-select:none;
  padding:8px 10px;
  background:#f3efe2;
  border-radius:7px;
  font-weight:bold;
  color:#6d5720;
}

.small{
  font-size:12px;
  color:#666;
}

.autosave-order-status{
  font-weight:bold;
  color:#08763c;
}

@media(max-width:700px){

  main{
    padding:10px;
  }

  .toolbar{
    flex-direction:column;
    align-items:stretch;
  }

  .toolbar input,
  .toolbar select,
  .toolbar button{
    width:100%;
    min-width:0;
  }

  .add-grid,
  .edit-grid{
    grid-template-columns:1fr;
  }

  .add-grid .full,
  .edit-grid .full{
    grid-column:auto;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .product img{
    height:480px;
  }

  .category-head{
    flex-direction:column;
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <h1>K&M CATALOGUE ADMIN</h1>
  <p>Product Manager</p>
</header>

<div id="loginArea" class="login-container">

  <h2>Admin Login</h2>

  <input
    type="email"
    id="email"
    placeholder="Admin Email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button id="loginButton">
    LOGIN
  </button>

  <div id="loginMessage"></div>

</div>

<main id="adminArea">

  <div class="admin-top">

    <div
      id="signedInUser"
      class="signed-in"
    ></div>

    <button
      id="logoutButton"
      class="logout-btn"
    >
      LOGOUT
    </button>

  </div>

  <div class="toolbar">

    <input
      id="productSearch"
      placeholder="Search product code, category or picture..."
    >

    <select id="categorySelect">
      <option value="ALL">
        ALL CATEGORIES
      </option>
    </select>

    <button
      id="addProductButton"
      class="gold"
    >
      + ADD PRODUCT
    </button>

    <button
      id="refreshButton"
      class="light"
    >
      REFRESH
    </button>

  </div>

  <section
    id="addPanel"
    class="add-panel"
  >

    <h3 style="margin-top:0;color:#003e2b">
      Add New Product
    </h3>

    <div class="add-grid">

      <div class="full">

        <label>
          Catalogue Picture *
        </label>

        <input
          id="newImage"
          type="file"
          accept="image/png,image/jpeg,image/webp"
        >

      </div>

      <div>

        <label>
          4SALE Product Code *
        </label>

        <input
          id="newCode"
          placeholder="Example: 10133"
        >

      </div>

      <div>

        <label>
          Category *
        </label>

        <select id="newCategory"></select>

      </div>

      <div>

        <label>
          Position in Category
        </label>

        <input
          id="newPosition"
          type="number"
          min="1"
          step="1"
          placeholder="Blank = end"
        >

      </div>

      <div>

        <label>Status</label>

        <select id="newActive">

          <option value="true">
            ON / SHOWING
          </option>

          <option value="false">
            OFF / HIDDEN
          </option>

        </select>

      </div>

    </div>

    <div
      class="form-actions"
      style="margin-top:14px"
    >

      <button
        id="saveNewProduct"
        class="primary"
      >
        SAVE PRODUCT
      </button>

      <button
        id="cancelNewProduct"
        class="light"
      >
        CANCEL
      </button>

    </div>

    <div
      id="addStatus"
      class="status"
    ></div>

  </section>

  <div id="loadingStatus">
    Loading products...
  </div>

  <div id="admin"></div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://gynnbpmghwwzimdzhxfw.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

const BUCKET =
  "product -image";


const categories = [

  {folder:"rise",title:"RICE"},

  {folder:"SAUCES",title:"SAUCES"},

  {folder:"drink",title:"DRINKS"},

  {folder:"snacks",title:"SNACKS & SWEETS"},

  {folder:"spices",title:"SPICES"},

  {
    folder:"beans&chickpease",
    title:"BEANS & CHICKPEAS"
  },

  {
    folder:"cooking essentials",
    title:"COOKING ESSENTIALS"
  },

  {folder:"PULSES",title:"PULSES"},

  {folder:"PICKLES",title:"PICKLES"},

  {
    folder:"TEA & COFFE",
    title:"TEA & COFFEE"
  },

  {
    folder:"Chewing Gum",
    title:"CHEWING GUM"
  },

  {
    folder:"Candy Sweets & Candy Toys",
    title:"CANDY SWEETS & CANDY TOYS"
  },

  {folder:"chips",title:"CHIPS"},

  {folder:"NUTS",title:"NUTS"},

  {folder:"TOILETRIES",title:"TOILETRIES"},

  {
    folder:"TESSUE AND WIPES",
    title:"TISSUE & WIPES"
  },

  {
    folder:"TRADITIONAL",
    title:"TRADITIONAL"
  },

  {
    folder:"GENERAL PRODUCTS",
    title:"GENERAL PRODUCTS"
  },

  {
    folder:"special-offer",
    title:"SPECIAL OFFER"
  }

];


const supabaseClient =
  window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_ANON_KEY,

    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }

  );


let products = [];

let adminLoaded = false;


/* ==============================
   HTML SAFE
   ============================== */

function esc(value){

  return String(
    value ?? ""
  )
  .replace(
    /[&<>"']/g,
    function(match){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[match];

    }
  );

}


/* ==============================
   IMAGE FILE NAME
   ============================== */

function filenameFromUrl(url){

  try{

    return decodeURIComponent(

      new URL(url)
        .pathname
        .split("/")
        .pop() || ""

    );

  }

  catch{

    return "";

  }

}


/* ==============================
   CATEGORY MENUS
   ============================== */

function fillCategoryMenus(){

  const options =
    categories
      .map(
        category =>
          '<option value="' +
          esc(category.folder) +
          '">' +
          esc(category.title) +
          '</option>'
      )
      .join("");


  document
    .getElementById("categorySelect")
    .innerHTML =

    '<option value="ALL">' +
    'ALL CATEGORIES' +
    '</option>' +

    options;


  document
    .getElementById("newCategory")
    .innerHTML =

    '<option value="">' +
    'CHOOSE CATEGORY...' +
    '</option>' +

    options;

}


fillCategoryMenus();


/* ==============================
   LOGIN SESSION
   ============================== */

async function getSessionOrThrow(){

  const {data,error} =
    await supabaseClient.auth
      .getSession();


  if(error){
    throw error;
  }


  if(
    !data.session ||
    !data.session.access_token
  ){

    throw new Error(
      "Login session expired. Please log in again."
    );

  }


  return data.session;

}


/* ==============================
   LOGIN
   ============================== */

async function loginAdmin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document
      .getElementById("loginMessage");


  const button =
    document
      .getElementById("loginButton");


  message.textContent = "";


  if(
    !email ||
    !password
  ){

    message.textContent =
      "Please enter your email and password.";

    return;

  }


  button.disabled = true;

  button.textContent =
    "LOGGING IN...";


  const {data,error} =
    await supabaseClient.auth
      .signInWithPassword({
        email,
        password
      });


  button.disabled = false;

  button.textContent =
    "LOGIN";


  if(
    error ||
    !data.session
  ){

    message.textContent =
      "Wrong email or password.";

    return;

  }


  document
    .getElementById("password")
    .value = "";


  adminLoaded = false;


  await showAdmin(
    data.session
  );

}


/* ==============================
   LOGOUT
   ============================== */

async function logoutAdmin(){

  await supabaseClient.auth
    .signOut();


  adminLoaded = false;


  document
    .getElementById("admin")
    .innerHTML = "";


  showLogin();

}


/* ==============================
   SHOW LOGIN
   ============================== */

function showLogin(){

  document
    .getElementById("adminArea")
    .style.display =
    "none";


  document
    .getElementById("loginArea")
    .style.display =
    "block";

}


/* ==============================
   SHOW ADMIN
   ============================== */

async function showAdmin(session){

  document
    .getElementById("loginArea")
    .style.display =
    "none";


  document
    .getElementById("adminArea")
    .style.display =
    "block";


  document
    .getElementById("signedInUser")
    .textContent =

    session.user?.email

      ? "Signed in: " +
        session.user.email

      : "Signed in";


  if(!adminLoaded){

    adminLoaded = true;

    await loadAdmin();

  }

}


/* ==============================
   CHECK LOGIN
   ============================== */

async function checkLogin(){

  const {data,error} =
    await supabaseClient.auth
      .getSession();


  if(
    error ||
    !data.session
  ){

    showLogin();

    return;

  }


  await showAdmin(
    data.session
  );

}


/* ==============================
   AUTH HEADERS
   ============================== */

async function authHeaders(prefer){

  const session =
    await getSessionOrThrow();


  const headers = {

    apikey:
      SUPABASE_ANON_KEY,

    Authorization:
      "Bearer " +
      session.access_token,

    "Content-Type":
      "application/json"

  };


  if(prefer){

    headers.Prefer =
      prefer;

  }


  return headers;

}


/* ==============================
   LOAD PRODUCTS
   ============================== */

async function loadAdmin(){

  const admin =
    document
      .getElementById("admin");


  const loading =
    document
      .getElementById("loadingStatus");


  loading.style.display =
    "block";


  admin.innerHTML = "";


  try{

    const headers =
      await authHeaders();


    const response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/product" +

        "?select=" +

        "id," +
        "image_url," +
        "is_active," +
        "category," +
        "display_order," +
        "code" +

        "&order=" +
        "category.asc," +
        "display_order.asc," +
        "id.asc",

        {
          headers
        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    products =
      await response.json();


    renderAdmin();

  }

  catch(error){

    admin.innerHTML =

      '<div class="error">' +

      'Could not load products.<br><br>' +

      esc(
        error.message ||
        error
      ) +

      '</div>';

  }

  finally{

    loading.style.display =
      "none";

  }

}


/* ==============================
   FILTER PRODUCTS
   ============================== */

function visibleProducts(){

  const selected =
    document
      .getElementById("categorySelect")
      .value;


  const search =
    document
      .getElementById("productSearch")
      .value
      .trim()
      .toLowerCase();


  return products.filter(

    product => {

      const categoryOK =

        selected === "ALL" ||

        product.category ===
          selected;


      const text =

        (
          (product.code || "") +

          " " +

          (product.category || "") +

          " " +

          filenameFromUrl(
            product.image_url || ""
          )
        )
        .toLowerCase();


      return (

        categoryOK &&

        (
          !search ||
          text.includes(search)
        )

      );

    }

  );

}


/* ==============================
   RENDER ADMIN
   ============================== */

function renderAdmin(){

  const admin =
    document
      .getElementById("admin");


  const visible =
    visibleProducts();


  if(!visible.length){

    admin.innerHTML =
      '<div class="small">' +
      'No products found.' +
      '</div>';

    return;

  }


  const grouped = {};


  visible.forEach(

    product => {

      const category =
        product.category ||
        "GENERAL PRODUCTS";


      if(!grouped[category]){

        grouped[category] = [];

      }


      grouped[category]
        .push(product);

    }

  );


  let html = "";


  categories.forEach(

    category => {

      if(
        grouped[category.folder] &&
        grouped[category.folder].length
      ){

        html +=
          renderCategory(

            category.folder,

            category.title,

            grouped[
              category.folder
            ]

          );

      }

    }

  );


  Object.keys(grouped)

    .filter(

      key =>
        !categories.some(
          category =>
            category.folder === key
        )

    )

    .sort()

    .forEach(

      key => {

        html +=
          renderCategory(
            key,
            key,
            grouped[key]
          );

      }

    );


  admin.innerHTML =
    html;


  bindDragDrop();

}


/* ==============================
   CATEGORY
   ============================== */

function renderCategory(
  folder,
  title,
  list
){

  list =
    [...list]
      .sort(

        (a,b) =>

          (
            Number(a.display_order) ||
            0
          )

          -

          (
            Number(b.display_order) ||
            0
          )

          ||

          Number(a.id) -
          Number(b.id)

      );


  return `

  <section
    class="category"
    data-category="${esc(folder)}"
  >

    <div class="category-head">

      <div>

        <h2>
          ${esc(title)}
        </h2>

        <div class="count">
          ${list.length} product(s)
        </div>

      </div>

      <div class="cat-actions">

        <span
          class="small autosave-order-status"
        >
          Drag products — order saves automatically
        </span>

      </div>

    </div>


    <div
      class="grid"
      data-grid="${esc(folder)}"
    >

      ${

        list
          .map(

            (product,index) =>

              renderProductCard(

                product,

                index,

                list.length

              )

          )
          .join("")

      }

    </div>

  </section>

  `;

}


/* ==============================
   PRODUCT CARD
   ============================== */

function renderProductCard(
  product,
  index,
  total
){

  return `

  <div
    class="product"
    draggable="true"
    data-id="${product.id}"
    data-category="${esc(
      product.category || ""
    )}"
  >

    <div class="toggle-area">

      <input
        type="checkbox"

        ${
          product.is_active !== false
            ? "checked"
            : ""
        }

        onchange="
          toggleProduct(
            ${product.id},
            this
          )
        "
      >

      <span>
        ${
          product.is_active !== false
            ? "ON"
            : "OFF"
        }
      </span>

    </div>


    <img
      src="${esc(
        product.image_url || ""
      )}"
      alt="${esc(
        filenameFromUrl(
          product.image_url || ""
        )
      )}"
      draggable="false"
    >


    <div class="code-badge">

      4SALE CODE:

      ${esc(
        product.code ||
        "NO CODE"
      )}

    </div>


    <div class="filename">

      ${esc(
        filenameFromUrl(
          product.image_url || ""
        )
      )}

    </div>


    <div class="edit-grid">

      <div>

        <label>
          4SALE CODE
        </label>

        <input
          id="code_${product.id}"
          value="${esc(
            product.code || ""
          )}"
          placeholder="Product code"
        >

      </div>


      <div>

        <label>
          CATEGORY
        </label>

        <select
          id="category_${product.id}"
        >

          ${

            categories
              .map(

                category => `

                <option

                  value="${esc(
                    category.folder
                  )}"

                  ${
                    category.folder ===
                    product.category

                      ? "selected"

                      : ""
                  }

                >

                  ${esc(
                    category.title
                  )}

                </option>

                `

              )
              .join("")

          }

        </select>

      </div>


      <div class="full form-actions">

        <button
          class="primary"
          onclick="
            saveProductDetails(
              ${product.id}
            )
          "
        >
          SAVE CODE / CATEGORY
        </button>

      </div>

    </div>


    <div class="order-tools">

      <span class="drag-handle">
        ☰ DRAG WITH MOUSE
      </span>

      <button
        class="light"

        ${
          index === 0
            ? "disabled"
            : ""
        }

        onclick="
          moveProduct(
            ${product.id},
            -1
          )
        "
      >
        ↑ UP
      </button>

      <button
        class="light"

        ${
          index === total - 1
            ? "disabled"
            : ""
        }

        onclick="
          moveProduct(
            ${product.id},
            1
          )
        "
      >
        ↓ DOWN
      </button>

      <span class="small">

        Position

        <b>
          ${index + 1}
        </b>

      </span>

    </div>

  </div>

  `;

}


/* ==============================
   DUPLICATE CODE CHECK
   ============================== */

async function codeExists(
  code,
  ignoreId
){

  if(!code){
    return false;
  }


  const headers =
    await authHeaders();


  const response =
    await fetch(

      SUPABASE_URL +

      "/rest/v1/product" +

      "?select=id,code" +

      "&code=ilike." +

      encodeURIComponent(code),

      {
        headers
      }

    );


  if(!response.ok){

    throw new Error(
      await response.text()
    );

  }


  const rows =
    await response.json();


  return rows.some(

    row =>

      Number(row.id) !==
      Number(ignoreId)

      &&

      String(
        row.code || ""
      )
      .trim()
      .toLowerCase()

      ===

      code
        .trim()
        .toLowerCase()

  );

}

async function saveProductDetails(id){

  const product =
    products.find(

      item =>

    );


  if(!product){

  }


  const code =

    )

    );

  }


  const headers =

      "return=minimal"
    );


  const response =
    await fetch(

      SUPABASE_URL +

      "/rest/v1/product" +

        headers,

          })

      }

/* ==============================
   PRODUCT ON / OFF
   ============================== */

async function toggleProduct(
  id,
  input
){

  const product =
    products.find(

      item =>
        Number(item.id) ===
        Number(id)

    );


  if(!product){
    return;
  }


  const wanted =
    input.checked;


  input.disabled =
    true;


  try{

    const headers =
      await authHeaders(
        "return=minimal"
      );


    const response =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/product" +

        "?id=eq." +
        id,

        {

          method:
            "PATCH",

          headers,

          body:
            JSON.stringify({

              is_active:
                wanted

            })

        }

      );


    if(!response.ok){

      throw new Error(
        await response.text()
      );

    }


    product.is_active =
      wanted;


    input
      .nextElementSibling
      .textContent =

      wanted
        ? "ON"
        : "OFF";

  }

  catch(error){

    input.checked =
      !wanted;


    alert(

      "Could not update product.\n\n" +

      error.message

    );

  }

  finally{

    input.disabled =
      false;

  }

}


/* ==============================
   UP / DOWN
   AUTO SAVE
   ============================== */

async function moveProduct(
  id,
  direction
){

  const card =
    document.querySelector(

      '.product[data-id="' +
      id +
      '"]'

    );


  if(!card){
    return;
  }


  const grid =
    card.parentElement;


  const cards =
    [...grid.children];


  const current =
    cards.indexOf(card);


  const target =
    current +
    direction;


  if(
    target < 0 ||
    target >= cards.length
  ){
    return;
  }


  if(direction < 0){

    grid.insertBefore(
      card,
      cards[target]
    );

  }

  else{

    grid.insertBefore(
      cards[target],
      card
    );

  }


  refreshPositions(
    grid
  );


  await autoSaveGridOrder(
    grid
  );

}


/* ==============================
   REFRESH POSITION LABEL
   ============================== */

function refreshPositions(grid){

  [...grid.children]
    .forEach(

      (card,index) => {

        const position =
          card.querySelector(
            ".order-tools .small"
          );


        if(position){

          position.innerHTML =

            "Position <b>" +

            (index + 1) +

            "</b>";

        }

      }

    );

}


/* ==============================
   MOUSE DRAG / DROP
   AUTO SAVE
   ============================== */

function bindDragDrop(){

  document
    .querySelectorAll(
      ".product"
    )
    .forEach(

      card => {

        let originalOrder =
          "";


        card.addEventListener(

          "dragstart",

          event => {

            const grid =
              card.parentElement;


            originalOrder =
              [...grid.children]
                .map(
                  item =>
                    item.dataset.id
                )
                .join(",");


            card
              .classList
              .add(
                "dragging"
              );


            event
              .dataTransfer
              .effectAllowed =
              "move";

          }

        );


        card.addEventListener(

          "dragend",

          async () => {

            const grid =
              card.parentElement;


            card
              .classList
              .remove(
                "dragging"
              );


            refreshPositions(
              grid
            );


            const newOrder =
              [...grid.children]
                .map(
                  item =>
                    item.dataset.id
                )
                .join(",");


            if(
              newOrder !==
              originalOrder
            ){

              await autoSaveGridOrder(
                grid
              );

            }

          }

        );


        card.addEventListener(

          "dragover",

          event => {

            event.preventDefault();


            const dragging =
              document.querySelector(
                ".product.dragging"
              );


            if(
              !dragging ||
              dragging === card ||
              dragging.parentElement !==
              card.parentElement
            ){

              return;

            }


            const rect =
              card
                .getBoundingClientRect();


            const before =

              event.clientY <

              rect.top +

              rect.height / 2;


            card.parentElement
              .insertBefore(

                dragging,

                before
                  ? card
                  : card.nextSibling

              );


            refreshPositions(
              card.parentElement
            );

          }

        );

      }

    );

}


/* ==============================
   AUTO SAVE CATEGORY ORDER
   ============================== */

async function autoSaveGridOrder(
  grid
){

  if(!grid){
    return;
  }


  const categorySection =
    grid.closest(
      ".category"
    );


  const status =
    categorySection
      .querySelector(
        ".autosave-order-status"
      );


  const cards =
    [...grid.children];


  status.textContent =
    "Saving order...";


  try{

    const headers =
      await authHeaders(
        "return=minimal"
      );


    for(
      let index = 0;
      index < cards.length;
      index++
    ){

      const id =
        cards[index]
          .dataset.id;


      const response =
        await fetch(

          SUPABASE_URL +

          "/rest/v1/product" +

          "?id=eq." +
          id,

          {

            method:
              "PATCH",

            headers,

            body:
              JSON.stringify({

                display_order:
                  index + 1

              })

          }

        );


      if(!response.ok){

        throw new Error(
          await response.text()
        );

      }


      const product =
        products.find(

          item =>
            Number(item.id) ===
            Number(id)

        );


      if(product){

        product.display_order =
          index + 1;

      }

    }


    status.textContent =
      "Saved automatically ✓";


    setTimeout(

      () => {

        status.textContent =
          "Drag products — order saves automatically";

      },

      1500

    );

  }

  catch(error){

    status.textContent =
      "Save failed";


    alert(

      "Could not save product order.\n\n" +

      error.message

    );


    await loadAdmin();

  }

}


/* ==============================
   SAFE IMAGE FILE NAME
   ============================== */

function cleanFilename(name){

  const dot =
    name.lastIndexOf(".");


  const extension =

    dot >= 0

      ? name
          .slice(dot)
          .toLowerCase()

      : ".png";


  const base =

    (
      dot >= 0
        ? name.slice(0,dot)
        : name
    )

    .normalize("NFKD")

    .replace(
      /[^a-zA-Z0-9_-]+/g,
      "-"
    )

    .replace(
      /-+/g,
      "-"
    )

    .replace(
      /^-|-$/g,
      ""
    )

    .slice(
      0,
      90
    )

    || "product";


  return (

    base +

    "-" +

    Date.now() +

    extension

  );

}


/* ==============================
   ADD PRODUCT
   ============================== */

async function addProduct(){

  const file =
    document
      .getElementById("newImage")
      .files?.[0];


  const code =
    document
      .getElementById("newCode")
      .value
      .trim();


  const category =
    document
      .getElementById("newCategory")
      .value;


  const positionValue =
    document
      .getElementById("newPosition")
      .value
      .trim();


  const isActive =

    document
      .getElementById("newActive")
      .value ===
      "true";


  const status =
    document
      .getElementById("addStatus");


  const button =
    document
      .getElementById("saveNewProduct");


  status.textContent =
    "";


  if(!file){

    status.textContent =
      "Please choose the catalogue picture.";

    return;

  }


  if(!code){

    status.textContent =
      "Please enter the 4SALE product code.";

    return;

  }


  if(!category){

    status.textContent =
      "Please choose the category.";

    return;

  }


  if(
    await codeExists(
      code,
      null
    )
  ){

    status.textContent =
      "That 4SALE code is already used.";

    return;

  }


  let displayOrder =
    Number(
      positionValue
    );


  if(
    !Number.isFinite(
      displayOrder
    )

    ||

    displayOrder < 1
  ){

    const sameCategory =
      products.filter(

        product =>
          product.category ===
          category

      );


    displayOrder =
      sameCategory.reduce(

        (max,product) =>
          Math.max(

            max,

            Number(
              product.display_order
            ) || 0

          ),

        0

      ) + 1;

  }


  button.disabled =
    true;


  button.textContent =
    "SAVING...";


  try{

    const session =
      await getSessionOrThrow();


    const filename =
      cleanFilename(
        file.name
      );


    const objectPath =

      category +

      "/" +

      filename;


    const encodedPath =

      objectPath

        .split("/")

        .map(
          encodeURIComponent
        )

        .join("/");


    status.textContent =
      "Uploading picture...";


    const upload =
      await fetch(

        SUPABASE_URL +

        "/storage/v1/object/" +

        encodeURIComponent(
          BUCKET
        ) +

        "/" +

        encodedPath,

        {

          method:
            "POST",

          headers:{

            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              "Bearer " +
              session.access_token,

            "Content-Type":
              file.type ||
              "application/octet-stream",

            "x-upsert":
              "false"

          },

          body:
            file

        }

      );


    if(!upload.ok){

      throw new Error(

        "Image upload failed: " +

        await upload.text()

      );

    }


    const imageUrl =

      SUPABASE_URL +

      "/storage/v1/object/public/" +

      encodeURIComponent(
        BUCKET
      ) +

      "/" +

      encodedPath;


    status.textContent =
      "Saving product...";


    const headers =
      await authHeaders(
        "return=representation"
      );


    const insert =
      await fetch(

        SUPABASE_URL +

        "/rest/v1/product",

        {

          method:
            "POST",

          headers,

          body:
            JSON.stringify({

              image_url:
                imageUrl,

              category,

              is_active:
                isActive,

              display_order:
                displayOrder,

              code

            })

        }

      );


    if(!insert.ok){

      throw new Error(

        "Product save failed: " +

        await insert.text()

      );

    }


    status.innerHTML =

      '<span class="ok">' +

      '✓ Product added. ' +

      '4SALE code saved and connector-ready.' +

      '</span>';


    document
      .getElementById("newImage")
      .value = "";


    document
      .getElementById("newCode")
      .value = "";


    document
      .getElementById("newPosition")
      .value = "";


    await loadAdmin();

  }

  catch(error){

    status.textContent =

      error.message ||

      String(error);

  }

  finally{

    button.disabled =
      false;


    button.textContent =
      "SAVE PRODUCT";

  }

}
