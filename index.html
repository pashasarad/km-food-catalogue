<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>K&M Food Catalogue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: Arial, sans-serif;
    }

    #catalogue {
      width: 100%;
      max-width: 794px;
      margin: auto;
      padding: 20px 0;
    }

    .static-page,
    .product-page {
      width: 100%;
      max-width: 794px;
      aspect-ratio: 210 / 297;
      background: white;
      margin-bottom: 25px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .static-page {
      object-fit: cover;
      display: block;
    }

    .product-page {
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    /* ========================================
       NORMAL CATEGORY HEADER
       ======================================== */

    .header {
      width: 100%;
      height: 90px;
      background: #003e2b;
      color: white;
      border-bottom: 5px solid #d4a62a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
    }

    .header strong {
      font-size: 18px;
    }

    .header h2 {
      margin: 0;
      color: #e2b63d;
      text-transform: uppercase;
    }

    /* ========================================
       SPECIAL OFFER TOP QUARTER
       ======================================== */

    .special-offer-banner {
      width: 100%;
      height: 25%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
      line-height: 0;
    }

    .special-offer-banner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center;
      margin: 0;
      padding: 0;
    }

    .special-offer-page {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    .special-offer-page .special-offer-banner {
      width: 100% !important;
      max-width: none !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }

    /* ========================================
       NORMAL CATEGORY: 6 PRODUCTS
       ======================================== */

    .grid {
      width: 100%;
      height: calc(100% - 90px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      column-gap: 8px;
      row-gap: 0;
      padding: 4px 8px 44px;
    }

    /* ========================================
       SPECIAL OFFER: 4 PRODUCTS
       ======================================== */

    .special-offer-page .grid {
      height: calc(75% - 42px);
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      column-gap: 8px;
      row-gap: 0;
      padding: 4px 8px;
    }

    .card {
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* ========================================
       FOOTER
       ======================================== */

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: #003e2b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 11px;
    }

    /* ========================================
       SEARCH
       ======================================== */

    .search-box {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid #003e2b;
      border-radius: 10px;
      text-align: center;
      outline: none;
      background: white;
    }

    .search-box input:focus {
      border-color: #d4a62a;
    }

    /* SMALL MOVING SEARCH */

    .floating-search {
      position: fixed;
      right: 15px;
      bottom: 20px;
      z-index: 9999;
    }

    .floating-search input {
      width: 150px;
      padding: 10px 14px;
      font-size: 14px;
      border: 2px solid #003e2b;
      border-radius: 25px;
      background: white;
      outline: none;
      box-shadow: 0 3px 10px rgba(0,0,0,0.18);
    }

    /* ========================================
       OPTIONAL CATEGORY BUTTONS
       ======================================== */

    .category-filter {
      max-width: 794px;
      margin: 15px auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .category-filter button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #003e2b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .category-filter button:hover {
      background: #d4a62a;
      color: #003e2b;
    }

    /* ========================================
       NO SEARCH RESULT
       ======================================== */

    .no-results {
      display: none;
      max-width: 700px;
      margin: 10px auto 30px;
      padding: 20px;
      text-align: center;
      background: white;
      color: #003e2b;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div id="catalogue">
  Loading catalogue...
</div>

<script>

  /* ========================================
     SUPABASE SETTINGS
     ======================================== */

  const SUPABASE_URL =
    "https://gynnbpmghwwzimdzhxfw.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

  const SPECIAL_OFFER_FOLDER =
    "special-offer";


  /* ========================================
     NORMALIZE TEXT FOR SEARCH
     ======================================== */

  function normalizeSearchText(text) {

    if (!text) {
      return "";
    }

    let value = String(text);

    try {
      value = decodeURIComponent(value);
    } catch (error) {
      // Keep original value.
    }

    return value
      .replace(/\.(png|jpg|jpeg|webp)$/i, "")
      .replace(/[_-]+/g, " ")
      .replace(/&/g, " ")
      .replace(/[()[\]{}.,/\\|:;'"!?+*=<>@#$%^`~]/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }


  /* ========================================
     GET DATA FROM SUPABASE
     ======================================== */

  async function getData(path) {

    const response = await fetch(
      SUPABASE_URL + path,
      {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization:
            "Bearer " + SUPABASE_ANON_KEY
        },

        /*
          IMPORTANT:
          Do not use old cached REST responses.
        */
        cache: "no-store"
      }
    );

    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(
        "Supabase request failed:",
        response.status,
        errorText
      );

      throw new Error(
        "Request failed: " +
        response.status
      );
    }

    return await response.json();
  }


  /* ========================================
     SPLIT ARRAY INTO GROUPS
     ======================================== */

  function chunks(array, size) {

    const output = [];

    for (
      let i = 0;
      i < array.length;
      i += size
    ) {

      output.push(
        array.slice(
          i,
          i + size
        )
      );
    }

    return output;
  }


  /* ========================================
     CREATE PRODUCT IMAGE URL

     IMPORTANT FIX:
     Every image can receive a unique version.
     This prevents the browser/CDN from
     showing an older picture.
     ======================================== */

  function getImageUrl(
    folder,
    filename,
    version = ""
  ) {

    const baseUrl =
      SUPABASE_URL +
      "/storage/v1/object/public/product%20-image/" +
      encodeURIComponent(folder) +
      "/" +
      encodeURIComponent(filename);

    if (!version) {
      return baseUrl;
    }

    return (
      baseUrl +
      "?v=" +
      encodeURIComponent(version)
    );
  }


  /* ========================================
     GET VERSION OF SUPABASE FILE
     ======================================== */

  function getFileVersion(file) {

    if (!file) {
      return Date.now();
    }

    /*
      Supabase normally returns updated_at.

      We also check other possible metadata
      fields as a fallback.
    */

    return (
      file.updated_at ||
      file.updatedAt ||
      file.last_modified ||
      file.lastModified ||
      file.created_at ||
      file.createdAt ||
      Date.now()
    );
  }


  /* ========================================
     SPECIAL OFFER BANNER
     ======================================== */

  const SPECIAL_OFFER_BANNER_URL =
    getImageUrl(
      "special-offer",
      "Codex Image 23 Aug 2026, 12_07_13.png"
    );


  function createSpecialOfferBanner() {

    const banner =
      document.createElement("div");

    banner.className =
      "special-offer-banner";


    const image =
      document.createElement("img");

    image.src =
      SPECIAL_OFFER_BANNER_URL +
      "?v=" +
      Date.now();

    image.alt =
      "Special Offer";


    banner.appendChild(image);

    return banner;
  }


  /* ========================================
     LOAD CATALOGUE
     ======================================== */

  async function loadCatalogue() {

    const catalogue =
      document.getElementById(
        "catalogue"
      );

    catalogue.innerHTML = "";


    try {

      /* ========================================
         LOAD STATIC CATALOGUE PAGES
         ======================================== */

      const pages =
        await getData(
          "/rest/v1/catalog_page?select=*&order=display_order.asc"
        );


      pages.forEach(pageData => {

        const image =
          document.createElement(
            "img"
          );

        /*
          Cache-bust static pages too.
        */

        const separator =
          pageData.image_url.includes("?")
            ? "&"
            : "?";

        image.src =
          pageData.image_url +
          separator +
          "v=" +
          Date.now();

        image.className =
          "static-page";

        catalogue.appendChild(
          image
        );
      });


      /* ========================================
         LOAD PRODUCT ON / OFF STATUS
         ======================================== */

      const products =
        await getData(
          "/rest/v1/product?select=image_url,is_active"
        );


      /* ========================================
         CATEGORY ORDER
         ======================================== */

      const categories = [

        {
          folder: SPECIAL_OFFER_FOLDER,
          title: "SPECIAL OFFER"
        },

        {
          folder: "rise",
          title: "RICE"
        },

        {
          folder: "cooking essentials",
          title: "COOKING ESSENTIALS"
        },

        {
          folder: "SAUCES",
          title: "SAUCES"
        },

        {
          folder: "PICKLES",
          title: "PICKLES"
        },

        {
          folder: "spices",
          title: "SPICES"
        },

        {
          folder: "beans&chickpease",
          title: "BEANS & CHICKPEAS"
        },

        {
          folder: "PULSES",
          title: "PULSES"
        },

        {
          folder: "drink",
          title: "DRINKS"
        },

        {
          folder: "TEA & COFFE",
          title: "TEA & COFFEE"
        },

        {
          folder: "snacks",
          title: "SNACKS & SWEETS"
        },

        {
          folder: "Chewing Gum",
          title: "CHEWING GUM"
        },

        {
          folder: "Candy Sweets & Candy Toys",
          title: "CANDY SWEETS & CANDY TOYS"
        },

        {
          folder: "chips",
          title: "CHIPS"
        },

        {
          folder: "NUTS",
          title: "NUTS"
        },

        {
          folder: "TOILETRIES",
          title: "TOILETRIES"
        },

        {
          folder: "TESSUE AND WIPES",
          title: "TISSUE & WIPES"
        },

        {
          folder: "TRADITIONAL",
          title: "TRADITIONAL"
        },

        {
          folder: "GENERAL PRODUCTS",
          title: "GENERAL PRODUCTS"
        }

      ];


      let pageNumber =
        pages.length + 1;


      /* ========================================
         SEARCH BOX
         ======================================== */

      const searchBox =
        document.createElement(
          "div"
        );

      searchBox.className =
        "search-box";


      const searchInput =
        document.createElement(
          "input"
        );

      searchInput.type =
        "search";

      searchInput.id =
        "categorySearch";

      searchInput.placeholder =
        "Search products...";

      searchInput.autocomplete =
        "off";

      searchInput.addEventListener(
        "input",
        searchCategory
      );


      searchBox.appendChild(
        searchInput
      );


      catalogue.appendChild(
        searchBox
      );


      /* ========================================
         SMALL MOVING SEARCH
         ======================================== */

      const floatingSearch =
        document.createElement("div");

      floatingSearch.className =
        "floating-search";


      const floatingSearchInput =
        document.createElement("input");

      floatingSearchInput.type =
        "search";

      floatingSearchInput.placeholder =
        "🔍 Search...";

      floatingSearchInput.autocomplete =
        "off";


      floatingSearchInput.addEventListener(
        "input",
        function () {

          searchInput.value =
            floatingSearchInput.value;

          searchInput.dispatchEvent(
            new Event(
              "input",
              { bubbles: true }
            )
          );
        }
      );


      floatingSearch.appendChild(
        floatingSearchInput
      );

      document.body.appendChild(
        floatingSearch
      );


      /* ========================================
         NO RESULTS MESSAGE
         ======================================== */

      const noResults =
        document.createElement(
          "div"
        );

      noResults.id =
        "noSearchResults";

      noResults.className =
        "no-results";

      noResults.textContent =
        "No products found.";

      catalogue.appendChild(
        noResults
      );


      /* ========================================
         LOAD EACH CATEGORY
         ======================================== */

      for (
        const category of categories
      ) {

        const response =
          await fetch(

            SUPABASE_URL +
            "/storage/v1/object/list/product%20-image",

            {
              method: "POST",

              headers: {

                apikey:
                  SUPABASE_ANON_KEY,

                Authorization:
                  "Bearer " +
                  SUPABASE_ANON_KEY,

                "Content-Type":
                  "application/json"
              },

              cache: "no-store",

              body:
                JSON.stringify({

                  prefix:
                    category.folder,

                  limit: 1000,

                  offset: 0,

                  sortBy: {
                    column: "name",
                    order: "asc"
                  }

                })
            }
          );


        if (!response.ok) {

          const errorText =
            await response.text();

          console.error(
            "Could not load category:",
            category.folder,
            response.status,
            errorText
          );

          throw new Error(
            "Could not load category: " +
            category.folder
          );
        }


        const files =
          await response.json();


        /* ========================================
           GET REAL PRODUCT IMAGE FILES
           ======================================== */

        const imageFiles =
          files.filter(file => {

            if (
              !file ||
              !file.name
            ) {
              return false;
            }


            const isImage =
              /\.(png|jpg|jpeg|webp)$/i
                .test(
                  file.name
                );


            if (!isImage) {
              return false;
            }


            /* ==================================
               DO NOT LOAD OFFER BANNER
               AS A PRODUCT
               ================================== */

            const currentImageUrl =
              getImageUrl(
                category.folder,
                file.name
              );


            if (
              category.folder ===
                SPECIAL_OFFER_FOLDER &&

              currentImageUrl ===
                SPECIAL_OFFER_BANNER_URL
            ) {
              return false;
            }


            return true;
          });


        /* ========================================
           REMOVE PRODUCTS SWITCHED OFF
           ======================================== */

        const images =
          imageFiles.filter(file => {

            /*
              IMPORTANT:

              Database image_url should be
              compared WITHOUT ?v= because
              database stores the original URL.
            */

            const imageUrl =
              getImageUrl(
                category.folder,
                file.name
              );


            const product =
              products.find(
                item =>
                  item.image_url ===
                  imageUrl
              );


            if (
              product &&
              product.is_active === false
            ) {
              return false;
            }


            return true;
          });


        /* ========================================
           EMPTY CATEGORY
           ======================================== */

        if (
          images.length === 0 &&
          category.folder !==
            SPECIAL_OFFER_FOLDER
        ) {
          continue;
        }


        /* ========================================
           PRODUCTS PER PAGE
           ======================================== */

        const productsPerPage =
          category.folder ===
            SPECIAL_OFFER_FOLDER
            ? 4
            : 6;


        /* ========================================
           CREATE GROUPS
           ======================================== */

        const groups =

          category.folder ===
            SPECIAL_OFFER_FOLDER &&

          images.length === 0

            ? [[]]

            : chunks(
                images,
                productsPerPage
              );


        /* ========================================
           CREATE EACH PRODUCT PAGE
           ======================================== */

        groups.forEach(group => {

          const page =
            document.createElement(
              "div"
            );


          page.className =
            "product-page";


          page.dataset.category =
            normalizeSearchText(
              category.folder
            );


          page.dataset.search =
            normalizeSearchText(
              category.title +
              " " +
              category.folder
            );


          /* ====================================
             CREATE HEADER
             ==================================== */

          let header;


          if (
            category.folder ===
            SPECIAL_OFFER_FOLDER
          ) {

            page.classList.add(
              "special-offer-page"
            );


            header =
              createSpecialOfferBanner();

          } else {

            header =
              document.createElement(
                "div"
              );


            header.className =
              "header";


            const companyName =
              document.createElement(
                "strong"
              );

            companyName.textContent =
              "K&M FOOD SUPPLIERS LTD";


            const categoryTitle =
              document.createElement(
                "h2"
              );

            categoryTitle.textContent =
              category.title;


            header.appendChild(
              companyName
            );

            header.appendChild(
              categoryTitle
            );
          }


          /* ====================================
             PRODUCT GRID
             ==================================== */

          const grid =
            document.createElement(
              "div"
            );


          grid.className =
            "grid";


          group.forEach(file => {

            const card =
              document.createElement(
                "div"
              );


            card.className =
              "card product-card";


            const searchableName =
              normalizeSearchText(
                file.name
              );


            card.dataset.name =
              searchableName;


            card.dataset.originalName =
              file.name;


            /* ====================================
               PRODUCT IMAGE

               MAIN IMAGE FIX IS HERE
               ==================================== */

            const image =
              document.createElement(
                "img"
              );


            /*
              Get the real Supabase file
              modification/version value.
            */

            const imageVersion =
              getFileVersion(file);


            /*
              Build the URL using THIS file's
              exact folder + exact filename +
              exact version.

              Example:

              drink/RANI PINEAPPLE.png
                 ?v=2026-09-06...

              If Pineapple is replaced,
              updated_at changes.

              Therefore browser must request
              the NEW Pineapple picture.
            */

            image.src =
              getImageUrl(
                category.folder,
                file.name,
                imageVersion
              );


            image.alt =
              file.name;


            image.dataset.filename =
              file.name;


            /*
              Important:
              Do not allow lazy-loading to
              accidentally retain an old image
              element while debugging.
            */

            image.loading =
              "eager";


            image.decoding =
              "async";


            image.onerror =
              function () {

                console.error(
                  "PRODUCT IMAGE FAILED:",
                  {
                    folder:
                      category.folder,

                    filename:
                      file.name,

                    version:
                      imageVersion,

                    url:
                      image.src
                  }
                );
              };


            /*
              This will show EXACTLY which
              filename and URL the catalogue
              is loading in browser console.
            */

            console.log(
              "PRODUCT IMAGE:",
              {
                folder:
                  category.folder,

                filename:
                  file.name,

                version:
                  imageVersion,

                url:
                  image.src
              }
            );


            card.appendChild(
              image
            );


            grid.appendChild(
              card
            );
          });


          /* ====================================
             FOOTER
             ==================================== */

          const footer =
            document.createElement(
              "div"
            );


          footer.className =
            "footer";


          const footerText =
            document.createElement(
              "span"
            );

          footerText.textContent =
            "QUALITY FOOD, TRUSTED EVERYTIME";


          const pageText =
            document.createElement(
              "span"
            );

          pageText.textContent =
            "PAGE " +
            pageNumber;


          footer.appendChild(
            footerText
          );

          footer.appendChild(
            pageText
          );


          /* ====================================
             BUILD PAGE
             ==================================== */

          page.appendChild(
            header
          );

          page.appendChild(
            grid
          );

          page.appendChild(
            footer
          );


          catalogue.appendChild(
            page
          );


          pageNumber++;
        });
      }


      console.log(
        "Catalogue loaded successfully."
      );


    } catch (error) {

      console.error(
        "Catalogue error:",
        error
      );


      catalogue.innerHTML =
        "<p style='padding:20px;color:red;text-align:center;'>" +
        "Could not load catalogue." +
        "</p>";
    }
  }


  /* ========================================
     CATEGORY FILTER
     ======================================== */

  function filterCategory(category) {

    const cataloguePages =
      document.querySelectorAll(
        ".product-page"
      );


    const selectedCategory =
      normalizeSearchText(
        category
      );


    cataloguePages.forEach(page => {

      const pageCategory =
        normalizeSearchText(
          page.dataset.category || ""
        );


      if (
        selectedCategory === "all" ||
        pageCategory ===
          selectedCategory
      ) {

        page.style.display =
          "";

      } else {

        page.style.display =
          "none";
      }
    });
  }


  /* ========================================
     PRODUCT / CATEGORY SEARCH
     ======================================== */

  function searchCategory() {

    const input =
      document.getElementById(
        "categorySearch"
      );


    if (!input) {
      return;
    }


    const search =
      normalizeSearchText(
        input.value
      );


    const searchTerms =
      search
        .split(" ")
        .filter(Boolean);


    const cataloguePages =
      document.querySelectorAll(
        ".product-page"
      );


    const staticPages =
      document.querySelectorAll(
        ".static-page"
      );


    const noResults =
      document.getElementById(
        "noSearchResults"
      );


    /* ========================================
       EMPTY SEARCH
       ======================================== */

    if (
      searchTerms.length === 0
    ) {

      staticPages.forEach(page => {

        page.style.display =
          "";

      });


      cataloguePages.forEach(page => {

        page.style.display =
          "";


        const cards =
          page.querySelectorAll(
            ".product-card"
          );


        cards.forEach(card => {

          card.style.display =
            "";

        });
      });


      if (noResults) {

        noResults.style.display =
          "none";
      }


      return;
    }


    /*
      When searching for an item,
      hide static catalogue pages.
    */

    staticPages.forEach(page => {

      page.style.display =
        "none";
    });


    let totalProductsFound =
      0;


    cataloguePages.forEach(page => {

      const categoryText =
        normalizeSearchText(
          page.dataset.search || ""
        );


      const cards =
        page.querySelectorAll(
          ".product-card"
        );


      const categoryMatch =
        searchTerms.every(
          term =>
            categoryText.includes(
              term
            )
        );


      let productsFoundOnPage =
        0;


      cards.forEach(card => {

        const productName =
          normalizeSearchText(
            card.dataset.name || ""
          );


        const productMatch =
          searchTerms.every(
            term =>
              productName.includes(
                term
              )
          );


        if (
          categoryMatch ||
          productMatch
        ) {

          card.style.display =
            "";


          productsFoundOnPage++;

          totalProductsFound++;

        } else {

          card.style.display =
            "none";
        }
      });


      if (
        productsFoundOnPage > 0
      ) {

        page.style.display =
          "";

      } else {

        page.style.display =
          "none";
      }
    });


    /* ========================================
       NO RESULTS MESSAGE
       ======================================== */

    if (noResults) {

      noResults.style.display =
        totalProductsFound === 0
          ? "block"
          : "none";
    }
  }


  /* ========================================
     START CATALOGUE
     ======================================== */

  loadCatalogue();

</script>

</body>
</html>
