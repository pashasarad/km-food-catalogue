<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K&M Food Catalogue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: Arial, sans-serif;
    }

    #catalogue {
      width: 100%;
      max-width: 794px;
      margin: auto;
      padding: 20px 0;
    }

    .static-page,
    .product-page {
      width: 100%;
      max-width: 794px;
      aspect-ratio: 210 / 297;
      background: white;
      margin-bottom: 25px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .static-page {
      object-fit: cover;
      display: block;
    }

    .product-page {
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    /* ========================================
       NORMAL CATEGORY HEADER
       ======================================== */

    .header {
      width: 100%;
      height: 90px;
      background: #003e2b;
      color: white;
      border-bottom: 5px solid #d4a62a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
    }

    .header strong {
      font-size: 18px;
    }

    .header h2 {
      margin: 0;
      color: #e2b63d;
      text-transform: uppercase;
    }

    /* ========================================
       SPECIAL OFFER TOP QUARTER
       ======================================== */

    .special-offer-banner {
      width: 100%;
      height: 25%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
      line-height: 0;
    }

    .special-offer-banner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center;
      margin: 0;
      padding: 0;
    }

    .special-offer-page {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }

    .special-offer-page .special-offer-banner {
      width: 100% !important;
      max-width: none !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }

    /* ========================================
       NORMAL CATEGORY: 6 PRODUCTS
       ======================================== */

    .grid {
      width: 100%;
      height: calc(100% - 90px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      column-gap: 8px;
      row-gap: 0;
      padding: 4px 8px 44px;
    }

    /* ========================================
       SPECIAL OFFER: 4 PRODUCTS
       ======================================== */

    .special-offer-page .grid {
      height: calc(75% - 42px);
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      column-gap: 8px;
      row-gap: 0;
      padding: 4px 8px;
    }

    .card {
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* ========================================
       FOOTER
       ======================================== */

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: #003e2b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 11px;
    }

    /* ========================================
       SEARCH
       ======================================== */

    .search-box {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid #003e2b;
      border-radius: 10px;
      text-align: center;
      outline: none;
    }

    /* ========================================
       OPTIONAL CATEGORY BUTTONS
       ======================================== */

    .category-filter {
      max-width: 794px;
      margin: 15px auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .category-filter button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #003e2b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .category-filter button:hover {
      background: #d4a62a;
      color: #003e2b;
    }
  </style>
</head>

<body>

<div id="catalogue">Loading catalogue...</div>

<script>

const SUPABASE_URL =
  "https://gynnbpmghwwzimdzhxfw.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

const SPECIAL_OFFER_FOLDER =
  "special-offer";


/* ========================================
   GET DATA FROM SUPABASE
   ======================================== */

async function getData(path) {

  const response = await fetch(
    SUPABASE_URL + path,
    {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization:
          "Bearer " + SUPABASE_ANON_KEY
      }
    }
  );

  if (!response.ok) {
    throw new Error(
      "Request failed: " +
      response.status
    );
  }

  return await response.json();
}


/* ========================================
   SPLIT ARRAY INTO GROUPS
   ======================================== */

function chunks(array, size) {

  const output = [];

  for (
    let i = 0;
    i < array.length;
    i += size
  ) {
    output.push(
      array.slice(i, i + size)
    );
  }

  return output;
}


/* ========================================
   CREATE PRODUCT IMAGE URL
   ======================================== */

function getImageUrl(folder, filename) {

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/product%20-image/" +
    encodeURIComponent(folder) +
    "/" +
    encodeURIComponent(filename)
  );
}


/* ========================================
   SPECIAL OFFER BANNER
   ======================================== */

const SPECIAL_OFFER_BANNER_URL =
  getImageUrl(
    "special-offer",
    "Codex Image 23 Aug 2026, 12_07_13.png"
  );


function createSpecialOfferBanner() {

  const banner =
    document.createElement("div");

  banner.className =
    "special-offer-banner";

  const image =
    document.createElement("img");

  image.src =
    SPECIAL_OFFER_BANNER_URL;

  image.alt =
    "Special Offer";

  banner.appendChild(image);

  return banner;
}


/* ========================================
   LOAD CATALOGUE
   ======================================== */

async function loadCatalogue() {

  const catalogue =
    document.getElementById(
      "catalogue"
    );

  catalogue.innerHTML = "";

  try {

    /* ========================================
       LOAD STATIC CATALOGUE PAGES
       ======================================== */

    const pages = await getData(
      "/rest/v1/catalog_page?select=*&order=display_order.asc"
    );

    pages.forEach(pageData => {

      const image =
        document.createElement("img");

      image.src =
        pageData.image_url;

      image.className =
        "static-page";

      catalogue.appendChild(image);
    });


    /* ========================================
       LOAD PRODUCT ON / OFF STATUS
       ======================================== */

    const products = await getData(
      "/rest/v1/product?select=image_url,is_active"
    );


    /* ========================================
       CATEGORY ORDER
       ======================================== */

    const categories = [

      {
        folder: SPECIAL_OFFER_FOLDER,
        title: "SPECIAL OFFER"
      },

      {
        folder: "rise",
        title: "RICE"
      },

      {
        folder: "cooking essentials",
        title: "COOKING ESSENTIALS"
      },

      {
        folder: "PICKLES",
        title: "PICKLES"
      },

      {
        folder: "spices",
        title: "SPICES"
      },

      {
        folder: "beans&chickpease",
        title: "BEANS & CHICKPEAS"
      },

      {
        folder: "drink",
        title: "DRINKS"
      },

      {
        folder: "TEA & COFFE",
        title: "TEA & COFFEE"
      },

      {
        folder: "snacks",
        title: "SNACKS & SWEETS"
      }

    ];


    let pageNumber =
      pages.length + 1;


    /* ========================================
       SEARCH BOX
       ======================================== */

    const searchBox =
      document.createElement("div");

    searchBox.className =
      "search-box";

    searchBox.innerHTML = `
      <input
        type="text"
        id="categorySearch"
        placeholder="Search products..."
        oninput="searchCategory()"
      >
    `;

    catalogue.appendChild(
      searchBox
    );


    /* ========================================
       LOAD EACH CATEGORY
       ======================================== */

    for (const category of categories) {

      const response = await fetch(
        SUPABASE_URL +
        "/storage/v1/object/list/product%20-image",
        {
          method: "POST",

          headers: {

            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_ANON_KEY,

            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            prefix:
              category.folder,

            limit: 1000,

            offset: 0,

            sortBy: {
              column: "name",
              order: "asc"
            }

          })
        }
      );


      if (!response.ok) {

        throw new Error(
          "Could not load category: " +
          category.folder
        );

      }


      const files =
        await response.json();


      /* ========================================
         GET REAL PRODUCT IMAGE FILES
         ======================================== */

      const imageFiles =
        files.filter(file => {

          const isImage =
            /\.(png|jpg|jpeg|webp)$/i
              .test(file.name);

          if (!isImage) {
            return false;
          }


          /*
             IMPORTANT:
             Do not use the special-offer
             banner as a product image.
          */

          if (
            category.folder ===
              SPECIAL_OFFER_FOLDER &&
            getImageUrl(
              category.folder,
              file.name
            ) ===
              SPECIAL_OFFER_BANNER_URL
          ) {
            return false;
          }


          return true;

        });


      /* ========================================
         REMOVE PRODUCTS SWITCHED OFF
         ======================================== */

      const images =
        imageFiles.filter(file => {

          const imageUrl =
            getImageUrl(
              category.folder,
              file.name
            );

          const product =
            products.find(
              item =>
                item.image_url ===
                imageUrl
            );

          if (
            product &&
            product.is_active === false
          ) {
            return false;
          }

          return true;

        });


      /*
         NORMAL EMPTY CATEGORIES:
         DO NOT DISPLAY.

         SPECIAL OFFER:
         ALWAYS KEEP ONE A4 PAGE.
      */

      if (
        images.length === 0 &&
        category.folder !==
          SPECIAL_OFFER_FOLDER
      ) {
        continue;
      }


      /*
         SPECIAL OFFER:
         4 PRODUCTS PER PAGE.

         NORMAL CATEGORY:
         6 PRODUCTS PER PAGE.
      */

      const productsPerPage =
        category.folder ===
          SPECIAL_OFFER_FOLDER
          ? 4
          : 6;


      /*
         SPECIAL OFFER WITH
         ZERO PRODUCTS:

         Create one empty page
         so the banner still shows.
      */

      const groups =
        category.folder ===
          SPECIAL_OFFER_FOLDER &&
        images.length === 0
          ? [[]]
          : chunks(
              images,
              productsPerPage
            );


      /* ========================================
         CREATE EACH PRODUCT PAGE
         ======================================== */

      groups.forEach(group => {

        const page =
          document.createElement(
            "div"
          );

        page.className =
          "product-page";

        page.dataset.category =
          category.folder;


        /* FIXED SEARCH DATA */

        page.dataset.search = (
          category.title +
          " " +
          category.folder
        ).toLowerCase();


        /* ========================================
           CREATE PAGE HEADER
           ======================================== */

        let header;

        if (
          category.folder ===
          SPECIAL_OFFER_FOLDER
        ) {

          page.classList.add(
            "special-offer-page"
          );

          header =
            createSpecialOfferBanner();

        } else {

          header =
            document.createElement(
              "div"
            );

          header.className =
            "header";

          header.innerHTML =
            "<strong>K&amp;M FOOD SUPPLIERS LTD</strong>" +
            "<h2>" +
            category.title +
            "</h2>";

        }


        /* ========================================
           PRODUCT GRID
           ======================================== */

        const grid =
          document.createElement(
            "div"
          );

        grid.className =
          "grid";


        group.forEach(file => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "card";

          card.classList.add(
            "product-card"
          );

          card.dataset.name =
            file.name.toLowerCase();


          const image =
            document.createElement(
              "img"
            );

          image.src =
            getImageUrl(
              category.folder,
              file.name
            );

          image.alt =
            file.name;


          card.appendChild(image);

          grid.appendChild(card);

        });


        /* ========================================
           FOOTER
           ======================================== */

        const footer =
          document.createElement(
            "div"
          );

        footer.className =
          "footer";

        footer.innerHTML =
          "<span>QUALITY FOOD, TRUSTED EVERYTIME</span>" +
          "<span>PAGE " +
          pageNumber +
          "</span>";


        /* ========================================
           BUILD PAGE
           ======================================== */

        page.appendChild(header);

        page.appendChild(grid);

        page.appendChild(footer);

        catalogue.appendChild(page);

        pageNumber++;

      });

    }


  } catch (error) {

    console.error(error);

    catalogue.innerHTML =
      "<p style='padding:20px;color:red;'>Could not load catalogue.</p>";

  }

}


/* START CATALOGUE */

loadCatalogue();


/* ========================================
   CATEGORY FILTER
   ======================================== */

function filterCategory(category) {

  const cataloguePages =
    document.querySelectorAll(
      ".product-page"
    );

  cataloguePages.forEach(page => {

    const pageCategory =
      page.dataset.category || "";

    if (
      category === "all" ||
      pageCategory === category
    ) {

      page.style.display = "";

    } else {

      page.style.display = "none";

    }

  });

}


/* ========================================
   PRODUCT / CATEGORY SEARCH
   ======================================== */

function searchCategory() {

  const input =
    document.getElementById(
      "categorySearch"
    );

  if (!input) {
    return;
  }


  const search =
    input.value
      .trim()
      .toLowerCase();


  const cataloguePages =
    document.querySelectorAll(
      ".product-page"
    );


  cataloguePages.forEach(page => {

    const category =
      (
        page.dataset.category || ""
      ).toLowerCase();


    const searchWords =
      (
        page.dataset.search ||
        category
      ).toLowerCase();


    const cards =
      page.querySelectorAll(
        ".product-card"
      );


    /* EMPTY SEARCH */

    if (search === "") {

      page.style.display = "";

      cards.forEach(card => {

        card.style.display = "";

      });

      return;

    }


    /* CATEGORY NAME MATCH */

    const categoryMatch =
      searchWords.includes(search);


    let productFound = false;


    /* PRODUCT NAME MATCH */

    cards.forEach(card => {

      const productName =
        (
          card.dataset.name || ""
        ).toLowerCase();


      const productMatch =
        productName.includes(search);


      if (productMatch) {

        productFound = true;

      }


      card.style.display =
        categoryMatch ||
        productMatch
          ? ""
          : "none";

    });


    /* SHOW / HIDE FULL PAGE */

    page.style.display =
      categoryMatch ||
      productFound
        ? ""
        : "none";

  });

}

</script>

</body>
</html>
