<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K&M Food Suppliers Ltd</title>

  <style>
    body {
      margin: 0;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
    }

    .catalogue {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    .page {
      width: 100%;
      display: block;
      margin-bottom: 20px;
      background: white;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>

  <div class="catalogue" id="catalogue">
    <p>Loading K&M Food Suppliers catalogue...</p>
  </div>

  <script>
     const SUPABASE_URL = "https://gynnbpmghwwzimdzhxfw.supabase.co";
   const SUPABASE_ANON_KEY = "sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

    async function loadCatalogue() {
      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/catalog_page?select=*&order=display_order.asc",
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY
          }
        }
      );

      const pages = await response.json();

      const catalogue = document.getElementById("catalogue");
      catalogue.innerHTML = "";

      pages.forEach(page => {
        const image = document.createElement("img");
        image.src = page.image_url;
        image.alt = page.page_key;
        image.className = "page";

        catalogue.appendChild(image);
      });
    }

    loadCatalogue();
  </script>

</body>
</html>
