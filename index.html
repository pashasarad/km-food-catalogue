<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K&M Food Catalogue</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eee;
      font-family: Arial, sans-serif;
    }

    #catalogue {
      width: 100%;
      max-width: 794px;
      margin: auto;
      padding: 20px 0;
    }

    .static-page,
    .product-page {
      width: 100%;
      max-width: 794px;
      aspect-ratio: 210 / 297;
      background: white;
      margin-bottom: 25px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
    }

    .static-page {
      object-fit: cover;
      display: block;
    }

    .product-page {
      position: relative;
      overflow: hidden;
      padding: 0;
    }

    /* NORMAL CATEGORY HEADER */

    .header {
      width: 100%;
      height: 90px;
      background: #003e2b;
      color: white;
      border-bottom: 5px solid #d4a62a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
    }

    .header strong {
      font-size: 18px;
    }

    .header h2 {
      margin: 0;
      color: #e2b63d;
      text-transform: uppercase;
    }

    /* SPECIAL OFFER TOP QUARTER */

    .special-offer-banner {
      width: 100%;
      height: 25%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: white;
      line-height: 0;
    }

    .special-offer-banner img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: fill;
      object-position: center;
      margin: 0;
      padding: 0;
    }
.special-offer-page {
  padding-left: 0 !important;
  padding-right: 0 !important;
}

.special-offer-page .special-offer-banner {
  width: 100% !important;
  max-width: none !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}
    /* NORMAL CATEGORY: 6 PRODUCTS */

    .grid {
      width: 100%;
      height: calc(100% - 90px);
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      column-gap: 8px;
      row-gap: 0;
      padding: 4px 8px 44px;
    }

    /* SPECIAL OFFER: 4 PRODUCTS */

    .special-offer-page .grid {
      height: calc(75% - 42px);
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(2, 1fr);
      column-gap: 8px;
      row-gap: 0;
      padding: 4px 8px;
    }

    .card {
      padding: 0;
      margin: 0;
      border: none;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
    }

    .card img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* FOOTER */

    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 42px;
      background: #003e2b;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 11px;
    }

    /* SEARCH */

    .search-box {
      width: 100%;
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .search-box input {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid #003e2b;
      border-radius: 10px;
      text-align: center;
      outline: none;
    }

    /* OPTIONAL CATEGORY BUTTONS */

    .category-filter {
      max-width: 794px;
      margin: 15px auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .category-filter button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #003e2b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .category-filter button:hover {
      background: #d4a62a;
      color: #003e2b;
    }
  </style>
</head>

<body>

<div id="catalogue">Loading catalogue...</div>

<script>

const SUPABASE_URL =
  "https://gynnbpmghwwzimdzhxfw.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

const SPECIAL_OFFER_FOLDER =
  "special-offer";

/*
  Your actual banner file:
  product-image
    / special-offer
      / special-offer-banner.jpg
        / Codex Image 23 Aug 2026, 12_07_13.png
*/


async function getData(path) {

  const response = await fetch(
    SUPABASE_URL + path,
    {
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization:
          "Bearer " + SUPABASE_ANON_KEY
      }
    }
  );

  if (!response.ok) {
    throw new Error(
      "Request failed: " +
      response.status
    );
  }

  return await response.json();
}


function chunks(array, size) {

  const output = [];

  for (
    let i = 0;
    i < array.length;
    i += size
  ) {
    output.push(
      array.slice(i, i + size)
    );
  }

  return output;
}


function getImageUrl(folder, filename) {

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/product%20-image/" +
    encodeURIComponent(folder) +
    "/" +
    encodeURIComponent(filename)
  );
}

const SPECIAL_OFFER_BANNER_URL = getImageUrl(
  "special-offer",
  "Codex Image 23 Aug 2026, 12_07_13.png"
);
function createSpecialOfferBanner() {

  const banner =
    document.createElement("div");

  banner.className =
    "special-offer-banner";

  const image =
    document.createElement("img");

  image.src =
    SPECIAL_OFFER_BANNER_URL;

  image.alt =
    "Special Offer";

  banner.appendChild(image);

  return banner;
}


async function loadCatalogue() {

  const catalogue =
    document.getElementById(
      "catalogue"
    );

  catalogue.innerHTML = "";

  try {

    /* LOAD STATIC CATALOGUE PAGES */

    const pages = await getData(
      "/rest/v1/catalog_page?select=*&order=display_order.asc"
    );

    pages.forEach(pageData => {

      const image =
        document.createElement("img");

      image.src =
        pageData.image_url;

      image.className =
        "static-page";

      catalogue.appendChild(image);
    });


    /* LOAD PRODUCT ON/OFF STATUS */

    const products = await getData(
      "/rest/v1/product?select=image_url,is_active"
    );


    /* CATEGORY ORDER */

    const categories = [
      {
        folder: SPECIAL_OFFER_FOLDER,
        title: "SPECIAL OFFER"
      },
      {
        folder: "rise",
        title: "RICE"
      },
      {
        folder: "cooking essentials",
        title: "COOKING ESSENTIALS"
      },
      {
        folder: "PICKLES",
        title: "PICKLES"
      },
      {
        folder: "spices",
        title: "SPICES"
      },
      {
        folder: "beans&chickpease",
        title: "BEANS & CHICKPEAS"
      },
      {
        folder: "drink",
        title: "DRINKS"
      },
      {
        folder: "TEA & COFFE",
        title: "TEA & COFFEE"
      },
      {
        folder: "snacks",
        title: "SNACKS & SWEETS"
      }
    ];


    let pageNumber =
      pages.length + 1;


    /* SEARCH BOX */

    const searchBox =
      document.createElement("div");

    searchBox.className =
      "search-box";

    searchBox.innerHTML = `
      <input
        type="text"
        id="categorySearch"
        placeholder="Search products..."
        oninput="searchCategory()"
      >
    `;

    catalogue.appendChild(
      searchBox
    );


    /* LOAD EACH CATEGORY */

    for (const category of categories) {

      const response = await fetch(
        SUPABASE_URL +
        "/storage/v1/object/list/product%20-image",
        {
          method: "POST",

          headers: {
            apikey:
              SUPABASE_ANON_KEY,

            Authorization:
              "Bearer " +
              SUPABASE_ANON_KEY,

            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prefix:
              category.folder,

            limit: 1000,

            offset: 0,

            sortBy: {
              column: "name",
              order: "asc"
            }
          })
        }
      );


      if (!response.ok) {

        throw new Error(
          "Could not load category: " +
          category.folder
        );
      }


      const files =
        await response.json();


      /* GET REAL PRODUCT IMAGE FILES */

      const imageFiles =
        files.filter(file => {

          const isImage =
            /\.(png|jpg|jpeg|webp)$/i
              .test(file.name);

          if (!isImage) {
            return false;
          }

          /*
            IMPORTANT:
            The banner folder is called
            special-offer-banner.jpg

            Never treat this as a product.
          */

       if (
  category.folder === SPECIAL_OFFER_FOLDER &&
  file.name === "Codex Image 23 Aug 2026, 12_07_13.png"
) {
  return false;
}

          return true;
        });


      /* REMOVE PRODUCTS SWITCHED OFF */

      const images =
        imageFiles.filter(file => {

          const imageUrl =
            getImageUrl(
              category.folder,
              file.name
            );

          const product =
            products.find(
              item =>
                item.image_url ===
                imageUrl
            );

          if (
            product &&
            product.is_active === false
          ) {
            return false;
          }

          return true;
        });


      /*
        NORMAL EMPTY CATEGORIES:
        DON'T SHOW THEM.

        SPECIAL OFFER IS DIFFERENT:
        IT MUST ALWAYS HAVE ITS OWN A4 PAGE.
      */

      if (
        images.length === 0 &&
        category.folder !==
          SPECIAL_OFFER_FOLDER
      ) {
        continue;
      }


      /*
        SPECIAL OFFER:
        4 PRODUCTS PER PAGE.

        NORMAL:
        6 PRODUCTS PER PAGE.
      */

      const productsPerPage =
        category.folder ===
          SPECIAL_OFFER_FOLDER
          ? 4
          : 6;


      /*
        SPECIAL OFFER WITH ZERO PRODUCTS:
        CREATE ONE EMPTY GROUP.

        This creates one full A4 page
        with the banner on the top 25%.
      */

      const groups =
        category.folder ===
          SPECIAL_OFFER_FOLDER &&
        images.length === 0
          ? [[]]
          : chunks(
              images,
              productsPerPage
            );


      groups.forEach(group => {

        const page =
          document.createElement(
            "div"
          );

        page.className =
          "product-page";

        page.dataset.category =
          category.folder;

        page.dataset.search =
          (
            category.title +
            " " +
            category.folder
          ).toLowerCase();


        /* CREATE HEADER */

        let header;

        if (
          category.folder ===
          SPECIAL_OFFER_FOLDER
        ) {

          page.classList.add(
            "special-offer-page"
          );

          header =
            createSpecialOfferBanner();

        } else {

          header =
            document.createElement(
              "div"
            );

          header.className =
            "header";

          header.innerHTML =
            "<strong>K&M FOOD SUPPLIERS LTD</strong>" +
            "<h2>" +
            category.title +
            "</h2>";
        }


        /* PRODUCT GRID */

        const grid =
          document.createElement(
            "div"
          );

        grid.className =
          "grid";


        group.forEach(file => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "card";

          const image =
            document.createElement(
              "img"
            );

          image.src =
            getImageUrl(
              category.folder,
              file.name
            );

          image.alt =
            file.name;

          card.appendChild(image);

          grid.appendChild(card);
        });


        /* FOOTER */

        const footer =
          document.createElement(
            "div"
          );

        footer.className =
          "footer";

        footer.innerHTML =
          "<span>QUALITY FOOD, TRUSTED EVERYTIME</span>" +
          "<span>PAGE " +
          pageNumber +
          "</span>";


        /* BUILD PAGE */

        page.appendChild(header);
        page.appendChild(grid);
        page.appendChild(footer);

        catalogue.appendChild(page);

        pageNumber++;
      });
    }

  } catch (error) {

    console.error(error);

    catalogue.innerHTML =
      "<p style='padding:20px;color:red;'>Could not load catalogue.</p>";
  }
}


loadCatalogue();


function filterCategory(category) {

  const cataloguePages =
    document.querySelectorAll(
      ".product-page"
    );

  cataloguePages.forEach(page => {

    const pageCategory =
      page.dataset.category || "";

    if (
      category === "all" ||
      pageCategory === category
    ) {
      page.style.display = "";
    } else {
      page.style.display = "none";
    }
  });
}


function searchCategory() {

  const input =
    document.getElementById(
      "categorySearch"
    );

  if (!input) {
    return;
  }

  const search =
    input.value
      .trim()
      .toLowerCase();

  const cataloguePages =
    document.querySelectorAll(
      ".product-page"
    );


  cataloguePages.forEach(page => {

    if (search === "") {

      page.style.display = "";
      return;
    }

    const category =
      (
        page.dataset.category ||
        ""
      ).toLowerCase();

    const searchWords =
      (
        page.dataset.search ||
        category
      ).toLowerCase();

    let match =
      searchWords.includes(search);


    /* RICE / RISE */

    if (
      (
        search.includes("rice") ||
        search.includes("rise")
      ) &&
      category === "rise"
    ) {
      match = true;
    }


    /* SPECIAL OFFER */

    if (
      (
        search.includes("offer") ||
        search.includes("special") ||
        search.includes("deal")
      ) &&
      category ===
        SPECIAL_OFFER_FOLDER
    ) {
      match = true;
    }


    /* DRINK */

    if (
      search.includes("drink") &&
      category === "drink"
    ) {
      match = true;
    }


    /* COOKING */

    if (
      search.includes("cooking") &&
      category ===
        "cooking essentials"
    ) {
      match = true;
    }


    /* SPICES */

    if (
      search.includes("spice") &&
      category === "spices"
    ) {
      match = true;
    }


    /* SNACKS */

    if (
      search.includes("snack") &&
      category === "snacks"
    ) {
      match = true;
    }


    /* PICKLES */

    if (
      search.includes("pickle") &&
      category === "pickles"
    ) {
      match = true;
    }


    /* BEANS */

    if (
      (
        search.includes("bean") ||
        search.includes("chickpea")
      ) &&
      category ===
        "beans&chickpease"
    ) {
      match = true;
    }


    /* TEA / COFFEE */

    if (
      (
        search.includes("tea") ||
        search.includes("coffee")
      ) &&
      category === "tea & coffe"
    ) {
      match = true;
    }


    page.style.display =
      match ? "" : "none";
  });
}

</script>

</body>
</html>
