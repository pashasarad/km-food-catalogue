<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K&M Food Catalogue</title>

  <style>
    body{
      margin:0;
      background:#eee;
      font-family:Arial,sans-serif;
    }

    #catalogue{
      max-width:794px;
      margin:auto;
      padding:20px 0;
    }

    .static-page,
    .product-page{
      width:100%;
      max-width:794px;
      aspect-ratio:210/297;
      background:white;
      margin-bottom:25px;
      box-shadow:0 2px 12px rgba(0,0,0,.15);
    }

    .static-page{
      object-fit:cover;
      display:block;
    }

    .product-page{
      position:relative;
      overflow:hidden;
    }

    .header{
      height:90px;
      background:#003e2b;
      color:white;
      border-bottom:5px solid #d4a62a;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 25px;
    }

    .header h2{
      margin:0;
      color:#e2b63d;
      text-transform:uppercase;
    }
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-template-rows:repeat(3,1fr);
  column-gap:8px;
  row-gap:0;
  padding:4px 8px 44px;
  height:calc(100% - 90px);
  box-sizing:border-box;
}

.card{
  padding:0;
  margin:0;
  border:none;
  background:transparent;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card img{
  width:100%;
  height:100%;
  object-fit:contain;
  transform:scale(1.04);
}

    .card{
  padding:0;
  margin:0;
  border:none;
  background:transparent;
  overflow:visible;
  display:flex;
  align-items:center;
  justify-content:center;
}
    .card img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.card{
    padding:0;
    margin:0;
    border:none;
    background:transparent;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:0;
    min-height:0;
}

    .footer{
      position:absolute;
      bottom:0;
      left:0;
      right:0;
      height:42px;
      background:#003e2b;
      color:white;
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:0 20px;
      font-size:11px;
    }
  .category-filter{
  max-width:794px;
  margin:15px auto;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}

.category-filter button{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:#003e2b;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.category-filter button:hover{
  background:#d4a62a;
  color:#003e2b;
}
.search-box {
  width: 100%;
  max-width: 700px;
  margin: 30px auto;
  padding: 0 20px;
  box-sizing: border-box;
}

.search-box input {
  width: 100%;
  padding: 16px 20px;
  font-size: 18px;
  border: 2px solid #003e2b;
  border-radius: 10px;
  text-align: center;
  box-sizing: border-box;
  outline: none;
}
  </style>
</head>

<body>
  
<div id="catalogue">Loading catalogue...</div>

<script>
const SUPABASE_URL =
"https://gynnbpmghwwzimdzhxfw.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_Fo7pTJH0jrNUMi-ShQHYjA_rUgnIvqR";

async function getData(path) {
  const r = await fetch(SUPABASE_URL + path, {
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: "Bearer " + SUPABASE_ANON_KEY
    }
  });

  if (!r.ok) {
    throw new Error("Request failed: " + r.status);
  }

  return await r.json();
}

function chunks(arr, size) {
  const out = [];

  for (let i = 0; i < arr.length; i += size) {
    out.push(arr.slice(i, i + size));
  }

  return out;
}

function getImageUrl(folder, filename) {
  return (
    SUPABASE_URL +
    "/storage/v1/object/public/product%20-image/" +
    encodeURIComponent(folder) +
    "/" +
    encodeURIComponent(filename)
  );
}

async function loadCatalogue() {

  const catalogue = document.getElementById("catalogue");
  catalogue.innerHTML = "";

  try {

    // LOAD NORMAL CATALOGUE PAGES
    const pages = await getData(
      "/rest/v1/catalog_page?select=*&order=display_order.asc"
    );

    pages.forEach(p => {
      const img = document.createElement("img");
      img.src = p.image_url;
      img.className = "static-page";
      catalogue.appendChild(img);
    });


    // LOAD PRODUCT ON/OFF STATUS
    const products = await getData(
      "/rest/v1/product?select=image_url,is_active"
    );


   const categories = [
  { folder: "special-offer", title: "SPECIAL OFFER" },
  { folder: "rise", title: "RICE" },
  { folder: "oil essentials", title: "OIL ESSENTIALS" },
  { folder: "spices", title: "SPICES" },
  { folder: "beans_pulses_chickpease", title: "BEANS, PULSES & CHICKPEAS" },
  { folder: "drink", title: "DRINKS" },
  { folder: "snacks", title: "SNACKS & SWEETS" }
];
    let pageNumber = pages.length + 1;

const searchBox = document.createElement("div");
searchBox.className = "search-box";

searchBox.innerHTML = `
  <input
    type="text"
    id="categorySearch"
    placeholder="Search products..."
    oninput="searchCategory()"
  >
`;

catalogue.appendChild(searchBox);
    for (const category of categories) {

      const response = await fetch(
        SUPABASE_URL + "/storage/v1/object/list/product%20-image",
        {
          method: "POST",

          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: "Bearer " + SUPABASE_ANON_KEY,
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prefix: category.folder,
            limit: 1000,
            offset: 0,
            sortBy: {
              column: "name",
              order: "asc"
            }
          })
        }
      );

      if (!response.ok) {
        throw new Error(
          "Could not load category: " + category.folder
        );
      }

      const files = await response.json();


      // GET IMAGE FILES
      const imageFiles = files.filter(file =>
        /\.(png|jpg|jpeg|webp)$/i.test(file.name)
      );


      // REMOVE PRODUCTS SWITCHED OFF IN ADMIN
      const images = imageFiles.filter(file => {

        const imageUrl = getImageUrl(
          category.folder,
          file.name
        );

        const product = products.find(
          p => p.image_url === imageUrl
        );

        // OFF = DON'T SHOW
        if (product && product.is_active === false) {
          return false;
        }

        // ON = SHOW
        return true;
      });


      // DON'T CREATE EMPTY CATEGORY
      if (images.length === 0) {
        continue;
      }


      const groups = chunks(images, 6);


      groups.forEach(group => {

        const page = document.createElement("div");
        page.className = "product-page";
page.dataset.category = category.folder;

        const header = document.createElement("div");
        header.className = "header";

        header.innerHTML =
          "<strong>K&M FOOD SUPPLIERS LTD</strong>" +
          "<h2>" + category.title + "</h2>";


        const grid = document.createElement("div");
        grid.className = "grid";


        group.forEach(file => {

          const card = document.createElement("div");
          card.className = "card";

          const img = document.createElement("img");

          img.src = getImageUrl(
            category.folder,
            file.name
          );

          img.alt = file.name;

          card.appendChild(img);
          grid.appendChild(card);

        });


        const footer = document.createElement("div");
        footer.className = "footer";

        footer.innerHTML =
          "<span>QUALITY FOOD, TRUSTED EVERYTIME</span>" +
          "<span>PAGE " + pageNumber + "</span>";


        page.appendChild(header);
        page.appendChild(grid);
        page.appendChild(footer);

        catalogue.appendChild(page);

        pageNumber++;

      });
    }

  } catch (error) {

    console.error(error);

    catalogue.innerHTML =
      "<p style='padding:20px;color:red;'>Could not load catalogue.</p>";
  }
}

loadCatalogue();
  function filterCategory(category) {
  const pages = document.querySelectorAll(".product-page");

  pages.forEach(page => {
    const pageCategory = page.getAttribute("data-category");

    if (category === "all" || pageCategory === category) {
      page.style.display = "";
    } else {
      page.style.display = "none";
    }
  });
}
  function searchCategory() {
  const search = document
    .getElementById("categorySearch")
    .value
    .trim()
    .toLowerCase();

  const pages = document.querySelectorAll(".product-page");

  pages.forEach(page => {
    const category = (page.dataset.category || "").toLowerCase();

    if (search === "") {
      page.style.display = "";
      return;
    }

    let match = false;
if ((search.includes("rice") || search.includes("rise")) && category === "rise") match = true;
    if (search.includes("drink") && category === "drink") match = true;
    if (search.includes("oil") && category === "oil") match = true;
    if (search.includes("snack") && category === "snacks") match = true;
    if (search.includes("spice") && category === "spices") match = true;

    page.style.display = match ? "" : "none";
  });
}
</script>

</body>
</html>
